name: Kitesurf Morning Briefing

on:
  schedule:
    # Runs at 10:00 UTC (07:00 AM Fortaleza/Cumbuco time UTC-3)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kitesurf Briefing Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python kitesurf_bot.py
